$kind: http-request
name: login
url: "{{baseUrl}}/auth/login"
method: POST
body:
  type: json
  content: "{\r

    \  \"email\": \"{{vault:email}}\",\r

    \  \"password\": \"{{vault:password}}\"\r

    }"
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: "const body = pm.response.json();\r

      pm.environment.set(\"token\", body.token);\r

      pm.environment.set(\"household\", body.household);"
    language: text/javascript
order: 1000
